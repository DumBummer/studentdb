{% extends 'base.html' %}{% block heading %}{{'Edit' if editing else 'Add'}} {{kind|replace('_',' ')}}{% endblock %}{% block content %}<div class="pagehead"><h2>Academic record</h2><a class="btn" href="{{url_for('manage_list',kind=kind)}}">← Back</a></div><form class="panel form" method="post"><div class="fields">{% for field,label,type in fields %}<label>{{label}}{% if type=='select' %}<select name="{{field}}" required><option value="">Choose {{label}}</option>{% for choice in choices[field] %}<option value="{{choice.id}}" {% if row.get(field)==choice.id %}selected{% endif %}>{{choice.label}} ({{choice.id}})</option>{% endfor %}</select>{% else %}<input name="{{field}}" type="{{type}}" {% if type=='number' %}step="any"{% endif %} value="{{row.get(field) if row.get(field) is not none else ''}}"></label>{% endif %}{% endfor %}</div><div class="formactions"><button class="btn primary">Save record</button></div></form>{% endblock %}
